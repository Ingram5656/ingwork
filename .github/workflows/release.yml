# 推一个 v 开头的标签（比如 v0.1.0）后，GitHub 在 Windows 和 Mac 上各打一个安装包，
# 放进一个 Release 草稿。说明取 CHANGELOG.md 里这一版的内容。检查一遍再在网页上点 Publish release。
#
# 草稿先单独建好，两个系统再一个接一个地往里传（先 Windows 后 Mac，一共二十分钟左右）。
# 以前是两边各自"没有草稿就建一个"、同时打包：0.6.2 那次两边几乎同时打完，各建了一个草稿，
# 发布出去的那个只有 Mac 的包。同时往一个草稿里传也不行，自动更新用的 latest.json 会互相盖掉。

name: release

on:
  push:
    tags: ["v*"]
  # 也可以在 Actions 页面手动跑一次，试试能不能打包
  workflow_dispatch:

jobs:
  # 先建好这一版的草稿（已经有了就用现成的），把编号交给后面
  draft:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      # 从 CHANGELOG.md 里取这一版的说明：从 "## [0.1.0]" 那一行到下一个 "## " 之前
      - name: 取这一版的更新说明
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "见 CHANGELOG.md" > notes.md
          fi

      - name: 建草稿
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")][0].id // empty")
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f name="ingwork $GITHUB_REF_NAME" \
              -F body=@notes.md \
              -F draft=true \
              -F prerelease=false \
              --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    # 手动跑（没有标签）时不建草稿，照样打包试试
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # 一个接一个：同时传的话 latest.json 会互相盖掉
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust_targets: ""
          # 一个安装包同时支持 M 系列和 Intel
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      # 这一版的说明也写进 latest.json（软件里检查更新时读得到）
      - name: 取这一版的更新说明
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          body=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$body" | tr -d '[:space:]')" ]; then
            body="见 CHANGELOG.md"
          fi
          {
            echo "body<<INGWORK_NOTES_END"
            echo "$body"
            echo "INGWORK_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      # 自动更新用的签名：用仓库 Secrets 里的私钥签（见 README"在软件里直接装新版"）。
      # tauri.updater.conf.json 打开 createUpdaterArtifacts，多打一份带签名的更新包和 latest.json。
      # 只在这里打开，自己电脑上用脚本打包时没有私钥也能打
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 传到上面建好的那个草稿里；tagName 留着，latest.json 里的下载地址要用
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseId: ${{ needs.draft.outputs.id }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json
