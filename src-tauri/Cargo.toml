[package]
name = "ingwork"
version = "0.6.0"
description = "ingwork：课表、待办、番茄钟和翻译放在一起"
authors = ["Ingram & Claude"]
edition = "2021"

[lib]
name = "ingwork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 版本和写法都跟 ingclock、ingtranslate 保持一致，几个项目能共用下载好的依赖
[dependencies]
# macos-private-api：Mac 上透明窗口（小组件、翻译、杂念箱）要用；Windows 上不起作用
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
# 自动更新：在后台下好新版、核对签名、装好后重启（见 update.rs）
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "blocking"] }
rodio = "0.19"
# 听课录音：麦克风、电脑播放的声音（0.17 起 Mac 也能录电脑的声音）。
# 放环境音的 rodio 还在用旧版，两个版本并存
cpal17 = { package = "cpal", version = "0.17" }
# 听课：导入录音或视频（mp3、m4a、mp4、wav……），边读边解码，不占多少内存
symphonia = { version = "0.5", features = ["aac", "isomp4", "mp3", "alac", "aiff", "caf"] }
# 听课：判断有没有人说话（纯 Rust 的小神经网络，约 100 KB）
earshot = "1.2"
# 听课：降噪（RNNoise 的 Rust 版）。默认功能会带上命令行工具，不要
nnnoiseless = { version = "0.5", default-features = false }
include_dir = "0.7"
# 翻译小窗读写剪贴板；只要文字，不要图片支持（和 ingtranslate 一样）
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
# 只用来取鼠标位置，好在鼠标所在的那块屏幕上呼出翻译和杂念箱（和 ingtranslate 一样）
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# 刘海番茄：把窗口放到菜单栏上面、读刘海的位置。Tauri 自己也用它，版本跟着 Tauri 走
objc2 = "0.6"
# 听课录电脑的声音：自己建"进程声音监听"和聚合设备（cpal 遇到带麦克风的耳机会去开麦克风）。
# 和 cpal 0.17 用的是同一套，不多下载东西
objc2-core-audio = { version = "0.3", default-features = false, features = [
  "std",
  "AudioHardware",
  "AudioHardwareDeprecated",
  "objc2",
  "objc2-foundation",
] }
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
